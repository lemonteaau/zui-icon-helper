name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_PLATFORM: android-36
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_ALIAS"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          KEYSTORE="$RUNNER_TEMP/release.jks" ./app/build.sh
          name="zui-icon-helper-${GITHUB_REF_NAME}.apk"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || name="zui-icon-helper-${GITHUB_SHA::7}.apk"
          mv app/build/zui-icon-helper.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"

      - name: Verify both signing identities
        env:
          PERSONAL_KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          PERSONAL_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
          PERSONAL_KEY_ALIAS: ${{ secrets.PERSONAL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --print-certs "$APK" | grep -F 'Signer #1 certificate SHA-256 digest: 05a771d7e6d9b442cc2bf2bc5ccc6bfe7728bd96cdfe43787d4b9b3204889238'
          # Only the public unsigned APK is used as a disposable signature probe.
          # The personally signed probe is never published or uploaded.
          umask 077
          trap 'rm -f "$RUNNER_TEMP/personal.jks" "$RUNNER_TEMP/probe.apk" "$RUNNER_TEMP/probe.apk.idsig"' EXIT
          printf '%s' "$PERSONAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/personal.jks"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/personal.jks" --ks-pass env:PERSONAL_KEYSTORE_PASSWORD --ks-key-alias "$PERSONAL_KEY_ALIAS" --out "$RUNNER_TEMP/probe.apk" app/build/aligned.apk
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/probe.apk" | grep -F 'Signer #1 certificate SHA-256 digest: 20b7537afcc70809438724103a5f62f95306ef2f12b3cdb05ca5ff2a53fb9500'

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          body_path: RELEASE_NOTES.md
